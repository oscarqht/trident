# macOS Apple Silicon desktop releases, built on the internal Mac Mini runner.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /^chore\(release\):/'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
    - when: never

stages: [prepare, build, publish]

variables:
  GIT_DEPTH: "0"
  NO_STRIP: "true"
  MACOS_RUNNER_TAG: "Alpha-iOS"

prepare:
  stage: prepare
  image: node:22-bookworm
  resource_group: release-version
  script:
    - node --test scripts/bump-version.test.js scripts/gitlab-release.test.js scripts/updater-credentials.test.mjs scripts/native-runtime.test.mjs scripts/macos-release.test.mjs scripts/style-dmg.test.mjs
    - node scripts/gitlab-release.mjs prepare
  artifacts:
    when: always
    paths: [release.env, changelog.txt]
    reports:
      dotenv: release.env
    expire_in: 1 week

.build:
  stage: build
  needs: [prepare]
  artifacts:
    paths: [release-assets/]
    expire_in: 1 week

build:macos:
  extends: .build
  tags: ['$MACOS_RUNNER_TAG']
  resource_group: macos-signing
  before_script:
    - export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
    - |
      if [ "$SHOULD_RELEASE" != "false" ] && ! command -v rustup >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      fi
  script:
    - export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
    - |
      if [ "$SHOULD_RELEASE" != "false" ]; then
        dmg_test_library=$(mktemp -d)
        trap 'rm -rf "$dmg_test_library"' EXIT
        python3 -m pip install --quiet --target "$dmg_test_library" ds_store mac_alias
        PYTHONPATH="$dmg_test_library" python3 scripts/write-dmg-layout.test.py
        node --test scripts/style-dmg.test.mjs
      fi
    - node scripts/gitlab-release.mjs build darwin-aarch64

publish:
  stage: publish
  image: node:22-bookworm
  needs: [prepare, 'build:macos']
  resource_group: release-publish
  script:
    - node scripts/gitlab-release.mjs publish
